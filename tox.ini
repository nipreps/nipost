[tox]
requires =
  tox>=4
  tox-uv
envlist =
  py312-{latest,min}
  py31{3,4}{,t}-{latest,pre}
  typecheck
  style
isolated_build = true

[gh-actions]
python =
  3.12: py312
  3.13: py313
  3.13t: py313t
  3.14: py314
  3.14t: py314t
  3.15: py315
  3.15t: py315t

[gh-actions:env]
DEPENDS =
  none: none
  pre: pre
  full: full
  min: min

MODE =
  threaded: threaded

ARCH =
  x64: x64
  x86: x86
  arm64: arm64

[testenv]
description = Pytest with coverage
extras = bids
dependency_groups = test
commands = pytest {posargs}
runner =
  latest: uv-venv-lock-runner
pip_pre =
  pre: true
pass_env =
  PY_COLORS
  FORCE_COLOR
  NO_COLOR
  CLICOLOR
  CLICOLOR_FORCE
set_env =
  pre: PIP_EXTRA_INDEX_URL=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
  pre: UV_INDEX=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
  pre: UV_INDEX_STRATEGY=unsafe-best-match
  py3{13-15}t: PYTHONGIL={env:PYTHONGIL:0}
uv_resolution =
  min: lowest-direct

[testenv:typecheck]
extras = test, bids
commands = mypy src

[testenv:style]
deps = ruff
commands =
    ruff check .
    ruff format --diff .
