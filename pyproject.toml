[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nipost"
description = "Minimal-derivatives resampling for the NiPreps post-processing family"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    "nitransforms >= 25.0.1",
    "numpy >= 2.2",
    "scipy >= 1.15",
    "nibabel >= 5.3",
]

[project.optional-dependencies]
bids = [
    "pybids >= 0.21",
    "niworkflows >= 1.14.4",
    "msgspec[yaml]>=0.19",
]

[dependency-groups]
test = [
    "pytest >= 7",
    "pytest-cov >= 4",
    "nilearn >= 0.12.1",
]
types = [
    "mypy>=2.1.0",
    "scipy-stubs>=1.15.3.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = [
  ".git_archival.txt",  # No longer needed in sdist
  "tests/data/ds005365*",  # Datalad subdatasets
]

[tool.hatch.build.targets.wheel]
packages = ["src/nipost"]

[tool.ruff]
line-length = 99

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "bids.*",
    "niworkflows.*",
    "nitransforms.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6"
addopts = [
  "-svx",
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--doctest-modules",
  # Config pytest-cov
  "--cov",
  "--cov-report", "term-missing",
  "--cov-report", "xml:cov.xml",
]
testpaths = ["src", "tests"]
log_level = "INFO"
xfail_strict = true
norecursedirs = [".git"]
doctest_optionflags = "ALLOW_UNICODE NORMALIZE_WHITESPACE ELLIPSIS"

[tool.coverage.run]
branch = true
source = ["nipost", "tests"]
omit = [
  "nipost/_version.py"

]
