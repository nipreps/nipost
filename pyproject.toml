[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nipost"
description = "Minimal-derivatives resampling for the NiPreps post-processing family"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    "nitransforms >= 24.0",
    "numpy >= 1.24",
    "scipy >= 1.10",
    "nibabel >= 5.0",
]

[project.optional-dependencies]
bids = [
    "pybids >= 0.16",
    "niworkflows >= 1.10",
]
test = [
    "pytest >= 7",
    "pytest-cov >= 4",
    "mypy >= 1.8",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/nipost"]

[tool.ruff]
line-length = 99

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "nibabel.*",
    "nitransforms.*",
    "scipy.*",
    "bids.*",
    "niworkflows.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=nipost --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["nipost", "tests"]
